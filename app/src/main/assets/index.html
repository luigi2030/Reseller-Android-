
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&M Panel Reseller</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;padding-bottom:35px}
header{background:linear-gradient(135deg,#9b111e,#e53935);padding:22px 12px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0}
.container{width:94%;max-width:700px;margin:15px auto}
.dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.card{background:#202020;border:1px solid #393939;border-radius:12px;padding:14px;text-align:center}
.card strong{display:block;font-size:25px;margin-bottom:5px}
.red{color:#ff5252}.green{color:#4caf50}.yellow{color:#ffca28}
h2{font-size:19px}
.panel{background:#202020;padding:16px;border-radius:12px;margin-bottom:16px;border:1px solid #393939}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #555;border-radius:7px;background:#303030;color:white;font-size:15px}
label{font-size:13px;color:#ddd}
button{border:0;border-radius:7px;padding:12px;color:white;font-weight:bold;cursor:pointer;margin:3px}
.primary{background:#e53935;width:100%}
.greenbtn{background:#168849}
.bluebtn{background:#1769aa}
.graybtn{background:#555}
.delete{background:#a52222}
.client{background:#292929;border:1px solid #444;border-radius:10px;padding:13px;margin:10px 0}
.client h3{margin:0 0 8px}
.client p{margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.actions button{flex:1}
.badge{display:inline-block;padding:5px 8px;border-radius:5px;background:#444;font-size:12px}
.expired{background:#8c2020}
.soon{background:#8b6411}
.ok{background:#176b3b}
.empty{text-align:center;color:#aaa;padding:20px}
.search{margin-bottom:10px}
small{color:#aaa}
</style>
</head>
<body>
<header>
<h1>🍕 L&M PANEL RESELLER</h1>
<p>Administración de clientes y servicios</p>
</header>

<div class="container">
<div class="dashboard">
<div class="card"><strong id="total">0</strong>Clientes</div>
<div class="card"><strong id="active" class="green">0</strong>Activos</div>
<div class="card"><strong id="expired" class="red">0</strong>Vencidos</div>
<div class="card"><strong id="soon" class="yellow">0</strong>Por vencer</div>
</div>

<div class="panel">
<h2 id="formTitle">➕ Registrar cliente</h2>
<form id="clientForm">
<input type="hidden" id="editId">
<label>Nombre del cliente</label>
<input id="name" required placeholder="Nombre y apellido">
<label>Servicio de streaming</label>
<select id="service" required>
<option value="">Seleccionar servicio</option>
<option>Netflix</option>
<option>Disney+</option>
<option>Max</option>
<option>Prime Video</option>
<option>IPTV</option>
<option>Otro</option>
</select>
<label>Usuario</label>
<input id="username" required placeholder="Usuario del cliente">
<label>Contraseña</label>
<input id="password" required placeholder="Contraseña">
<label>Teléfono (con código de país)</label>
<input id="phone" placeholder="Ej. 5493811234567">
<label>Fecha de inicio</label>
<input type="date" id="start" required>
<label>Fecha de vencimiento</label>
<input type="date" id="end" required>
<button class="primary" type="submit">💾 Guardar cliente</button>
<button class="graybtn" type="button" id="cancelEdit" style="display:none;width:100%">Cancelar edición</button>
</form>
</div>

<div class="panel">
<h2>📋 Mis clientes</h2>
<input class="search" id="search" placeholder="🔎 Buscar por nombre, usuario o servicio">
<select id="filter">
<option value="">Todos los servicios</option>
<option>Netflix</option><option>Disney+</option>
<option>Max</option><option>Prime Video</option>
<option>IPTV</option><option>Otro</option>
</select>
<div id="clients"></div>
</div>

<div class="panel">
<h2>📤 Copia de seguridad</h2>
<button class="bluebtn" onclick="exportData()">Descargar respaldo</button>
<button class="greenbtn" onclick="exportCSV()">Exportar Excel (CSV)</button>
<button class="graybtn" onclick="document.getElementById('importFile').click()">Importar respaldo</button>
<input type="file" id="importFile" accept=".json" style="display:none">
<p><small>Conservá una copia de seguridad de tus clientes. Los datos se guardan en este dispositivo.</small></p>
</div>
</div>

<script>
const KEY="lm_reseller_clients_v1";
let clients=JSON.parse(localStorage.getItem(KEY)||"[]");

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);

function save(){
 localStorage.setItem(KEY,JSON.stringify(clients));
 render();
}
function status(c){
 const diff=Math.ceil((new Date(c.end+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000);
 if(diff<0)return "Vencido";
 if(diff<=5)return "Por vencer";
 return "Activo";
}
function render(){
 const active=clients.filter(c=>status(c)==="Activo").length;
 const expired=clients.filter(c=>status(c)==="Vencido").length;
 const soon=clients.filter(c=>status(c)==="Por vencer").length;
 $("total").textContent=clients.length;
 $("active").textContent=active;
 $("expired").textContent=expired;
 $("soon").textContent=soon;

 const q=$("search").value.toLowerCase();
 const f=$("filter").value;
 const list=clients.filter(c=>
  (!f||c.service===f)&&
  [c.name,c.username,c.service].some(x=>x.toLowerCase().includes(q))
 );
 const container=$("clients");
 container.innerHTML="";
 if(!list.length){
  container.innerHTML='<div class="empty">No hay clientes para mostrar</div>';
  return;
 }
 list.sort((a,b)=>a.end.localeCompare(b.end));
 list.forEach(c=>{
  const s=status(c);
  const cls=s==="Activo"?"ok":s==="Por vencer"?"soon":"expired";
  const el=document.createElement("div");
  el.className="client";
  const h=document.createElement("h3");
  h.textContent=c.name;
  const p=document.createElement("p");
  p.textContent="Servicio: "+c.service;
  const u=document.createElement("p");
  u.textContent="Usuario: "+c.username;
  const d=document.createElement("p");
  d.textContent="Vencimiento: "+c.end;
  const b=document.createElement("span");
  b.className="badge "+cls;
  b.textContent=s;
  const actions=document.createElement("div");
  actions.className="actions";
  actions.innerHTML=
   '<button class="bluebtn" data-action="edit">Editar</button>'+
   '<button class="greenbtn" data-action="welcome">Bienvenida</button>'+
   '<button class="greenbtn" data-action="renew">Renovación</button>'+
   '<button class="delete" data-action="delete">Eliminar</button>';
  actions.querySelectorAll("button").forEach(btn=>{
   btn.addEventListener("click",()=>{
    const action=btn.dataset.action;
    if(action==="edit")editClient(c.id);
    if(action==="welcome")sendMessage(c,"welcome");
    if(action==="renew")sendMessage(c,"renew");
    if(action==="delete")deleteClient(c.id);
   });
  });
  el.append(h,p,u,d,b,actions);
  container.appendChild(el);
 });
}
$("clientForm").addEventListener("submit",e=>{
 e.preventDefault();
 const id=$("editId").value;
 const c={
  id:id||String(Date.now()),
  name:$("name").value.trim(),
  service:$("service").value,
  username:$("username").value.trim(),
  password:$("password").value,
  phone:$("phone").value.trim(),
  start:$("start").value,
  end:$("end").value
 };
 if(c.end<c.start){alert("El vencimiento no puede ser anterior al inicio.");return;}
 if(id){
  clients=clients.map(x=>x.id===id?c:x);
 }else{
  clients.push(c);
 }
 save();
 resetForm();
 alert("Cliente guardado correctamente.");
});
function editClient(id){
 const c=clients.find(x=>x.id===id);
 if(!c)return;
 $("editId").value=c.id;
 $("name").value=c.name;
 $("service").value=c.service;
 $("username").value=c.username;
 $("password").value=c.password;
 $("phone").value=c.phone;
 $("start").value=c.start;
 $("end").value=c.end;
 $("formTitle").textContent="✏️ Editar cliente";
 $("cancelEdit").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}
function resetForm(){
 $("clientForm").reset();
 $("editId").value="";
 $("formTitle").textContent="➕ Registrar cliente";
 $("cancelEdit").style.display="none";
}
$("cancelEdit").onclick=resetForm;
function deleteClient(id){
 if(confirm("¿Seguro que querés eliminar este cliente?")){
  clients=clients.filter(c=>c.id!==id);
  save();
 }
}
function sendMessage(c,type){
 let msg=type==="welcome"
 ?`¡Hola ${c.name}! Te damos la bienvenida. Tu servicio ${c.service} ya está registrado. ¡Gracias por elegirnos!`
 :`¡Hola ${c.name}! Te recordamos que tu servicio ${c.service} vence el ${c.end}. Comunicate con nosotros para renovarlo. ¡Gracias!`;
 if(c.phone){
  const phone=c.phone.replace(/\D/g,"");
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");
 }else{
  if(navigator.clipboard)navigator.clipboard.writeText(msg);
  alert("El cliente no tiene teléfono registrado. Mensaje copiado si el navegador lo permite:\n\n"+msg);
 }
}
function exportData(){
 const blob=new Blob([JSON.stringify(clients,null,2)],{type:"application/json"});
 download(blob,"LM-respaldo.json");
}
function exportCSV(){
 const rows=[["Nombre","Servicio","Usuario","Contraseña","Telefono","Inicio","Vencimiento"]];
 clients.forEach(c=>rows.push([c.name,c.service,c.username,c.password,c.phone,c.start,c.end]));
 const csv=rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(";")).join("\n");
 download(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),"LM-clientes.csv");
}
function download(blob,name){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=name;
 a.click();
 URL.revokeObjectURL(a.href);
}
$("importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data))throw Error();
  if(confirm("¿Reemplazar los clientes actuales por el respaldo?")){
   clients=data;
   save();
   alert("Respaldo importado.");
  }
 }catch(err){alert("El archivo no es un respaldo válido.");}
 e.target.value="";
});
$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
render();
</script>
</body>
</html>
